server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:16}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:64}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:32}

spring:
  application:
    name: your-space-backend

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  articles:
    directory: ${ARTICLE_CONTENT_DIR:./public/articles}
  wikipedia:
    on-this-day-url: ${WIKIPEDIA_ON_THIS_DAY_URL:https://api.wikimedia.org/feed/v1/wikipedia/zh/onthisday/all}
