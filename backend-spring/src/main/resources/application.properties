# Java 服务独占 8081；现有 Python 服务继续使用 8080。
server.port=${SERVER_PORT:8081}
spring.application.name=airchord-backend
airchord.wikipedia.on-this-day-url=${WIKIPEDIA_ON_THIS_DAY_URL:https://api.wikimedia.org/feed/v1/wikipedia/zh/onthisday/all}
airchord.wikipedia.time-zone=${WIKIPEDIA_TIME_ZONE:Asia/Shanghai}

# 数据库只从独立的 PostgreSQL 配置读取，不引用 Python SQLite 路径。
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/air_spring_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:airchord_local}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# 数据表结构统一由 Flyway 管理，关闭 Spring 自带的 schema.sql/data.sql 初始化。
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis 用于公开详情缓存与登录 session；缓存可回源，认证 session 不可用时会拒绝认证。
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:1s}

# 登录 session 和公开内容缓存共用本地 Redis；用独立 namespace 区分生命周期。
spring.session.data.redis.namespace=airchord:session
spring.session.data.redis.flush-mode=on-save
# 管理员改权时按用户名撤销 session，因此需要带主体索引的 Redis 仓储。
spring.session.data.redis.repository-type=indexed
server.servlet.session.timeout=${AUTH_SESSION_TIMEOUT:7d}
server.servlet.session.cookie.name=${AUTH_COOKIE_NAME:air_session}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${AUTH_COOKIE_SAMESITE:Lax}

# 公开注册开关首次启动时写入 PostgreSQL；已有值优先，后续供管理员设置接口维护。
airchord.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:true}
airchord.auth.bootstrap-admin-username=${AUTH_ADMIN_USERNAME:}
airchord.auth.bootstrap-admin-password=${AUTH_ADMIN_PASSWORD:}
airchord.auth.bootstrap-user-username=${AUTH_USER_USERNAME:}
airchord.auth.bootstrap-user-password=${AUTH_USER_PASSWORD:}
airchord.auth.session-timeout=${AUTH_SESSION_TIMEOUT:7d}
airchord.auth.cookie-name=${AUTH_COOKIE_NAME:air_session}
airchord.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
airchord.auth.cookie-same-site=${AUTH_COOKIE_SAMESITE:Lax}
airchord.auth.avatar-max-bytes=${AUTH_AVATAR_MAX_BYTES:2097152}

# 上传头像上限与业务校验一致；请求体稍大一些以容纳 multipart 边界。
# 编辑器一个 multipart 请求里可能含封面和多张正文图片；总请求上限固定为 100 MiB。
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:100MB}

# 仅允许配置的前端源携带 Cookie；不使用通配符来源。
airchord.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# 缓存采用有界 TTL 抖动；详情失效锁只合并同一个 key 的并发回源。
airchord.cache.public-content.ttl=5m
airchord.cache.public-content.ttl-jitter=30s
airchord.cache.public-content.lock-ttl=10s
airchord.cache.public-content.lock-wait=2s
airchord.cache.public-content.lock-poll=50ms

# Python 数据库模式下，正文在 PostgreSQL，封面等静态资源仍存放在这些目录。
airchord.media.articles-dir=${ARTICLE_CONTENT_DIR:../public/articles}
airchord.media.chatter-dir=${CHATTER_CONTENT_DIR:../public/chatter}
airchord.media.music-dir=${MUSIC_CONTENT_DIR:../music}
airchord.comments.enabled=${COMMENTS_ENABLED:true}
airchord.comments.max-length=${COMMENTS_MAX_LENGTH:1000}
airchord.editor.enabled=${EDITOR_ENABLED:false}
airchord.editor.upload-max-bytes=${EDITOR_UPLOAD_MAX_BYTES:104857600}
airchord.music.max-upload-bytes=${MUSIC_MAX_UPLOAD_BYTES:52428800}
# 暂存目录与公开的 MUSIC_CONTENT_DIR 分离，避免未完成上传被 /music/** 访问。
airchord.music.import-staging-dir=${MUSIC_IMPORT_STAGING_DIR:../.airchord-import-staging}
airchord.music.import-max-jobs=${MUSIC_IMPORT_MAX_JOBS:20}
airchord.music.import-max-staging-bytes=${MUSIC_IMPORT_MAX_STAGING_BYTES:1073741824}

# Outbox 在 RabbitMQ 中断期间保留任务；发布确认成功后才记录已发送。
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:airchord_local}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# 一个 JVM 内只处理一条导入消息；手动确认保证数据库状态写完后才移走消息。
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
airchord.perf-timing-enabled=${AIRCHORD_PERF_TIMING_ENABLED:false}
airchord.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
airchord.rate-limit.max-keys=${RATE_LIMIT_MAX_KEYS:10000}
airchord.rate-limit.trust-proxy-headers=${RATE_LIMIT_TRUST_PROXY_HEADERS:false}
airchord.rate-limit.trusted-proxy-ips=${TRUSTED_PROXY_IPS:127.0.0.1}
airchord.rate-limit.login-ip-max=${RATE_LIMIT_LOGIN_IP_MAX:5}
airchord.rate-limit.login-ip-seconds=${RATE_LIMIT_LOGIN_IP_WINDOW_SECONDS:60}
airchord.rate-limit.login-user-max=${RATE_LIMIT_LOGIN_USERNAME_MAX:10}
airchord.rate-limit.login-user-seconds=${RATE_LIMIT_LOGIN_USERNAME_WINDOW_SECONDS:600}
airchord.rate-limit.register-max=${RATE_LIMIT_REGISTER_IP_MAX:3}
airchord.rate-limit.register-seconds=${RATE_LIMIT_REGISTER_IP_WINDOW_SECONDS:3600}
airchord.rate-limit.comment-ip-max=${RATE_LIMIT_COMMENT_IP_MAX:20}
airchord.rate-limit.comment-ip-seconds=${RATE_LIMIT_COMMENT_IP_WINDOW_SECONDS:60}
airchord.rate-limit.comment-user-max=${RATE_LIMIT_COMMENT_USER_MAX:10}
airchord.rate-limit.comment-user-seconds=${RATE_LIMIT_COMMENT_USER_WINDOW_SECONDS:60}
airchord.rate-limit.guestbook-ip-max=${RATE_LIMIT_GUESTBOOK_IP_MAX:10}
airchord.rate-limit.guestbook-ip-seconds=${RATE_LIMIT_GUESTBOOK_IP_WINDOW_SECONDS:3600}
airchord.rate-limit.guestbook-user-max=${RATE_LIMIT_GUESTBOOK_USER_MAX:3}
airchord.rate-limit.guestbook-user-seconds=${RATE_LIMIT_GUESTBOOK_USER_WINDOW_SECONDS:3600}
airchord.rate-limit.avatar-user-max=${RATE_LIMIT_AVATAR_USER_MAX:5}
airchord.rate-limit.avatar-user-seconds=${RATE_LIMIT_AVATAR_USER_WINDOW_SECONDS:3600}
airchord.rate-limit.admin-max=${RATE_LIMIT_ADMIN_MAX:60}
airchord.rate-limit.admin-seconds=${RATE_LIMIT_ADMIN_WINDOW_SECONDS:60}
airchord.rate-limit.csrf-max=${RATE_LIMIT_CSRF_IP_MAX:30}
airchord.rate-limit.csrf-seconds=${RATE_LIMIT_CSRF_IP_WINDOW_SECONDS:60}
airchord.rate-limit.article-view-ip-max=${RATE_LIMIT_ARTICLE_VIEW_IP_MAX:120}
airchord.rate-limit.article-view-ip-seconds=${RATE_LIMIT_ARTICLE_VIEW_IP_WINDOW_SECONDS:60}
airchord.rate-limit.article-like-ip-max=${RATE_LIMIT_ARTICLE_LIKE_IP_MAX:300}
airchord.rate-limit.article-like-ip-seconds=${RATE_LIMIT_ARTICLE_LIKE_IP_WINDOW_SECONDS:60}
airchord.rate-limit.article-like-user-max=${RATE_LIMIT_ARTICLE_LIKE_USER_MAX:30}
airchord.rate-limit.article-like-user-seconds=${RATE_LIMIT_ARTICLE_LIKE_USER_WINDOW_SECONDS:60}

airchord.article-metric.consumer-batch-size=${ARTICLE_METRIC_CONSUMER_BATCH_SIZE:100}
airchord.article-metric.consumer-batch-wait-ms=${ARTICLE_METRIC_CONSUMER_BATCH_WAIT_MS:100}

airchord.article-metric.publisher-max-batches=${ARTICLE_METRIC_PUBLISHER_MAX_BATCHES:1}
airchord.article-metric.mark-server-prepare-disabled=${ARTICLE_METRIC_MARK_SERVER_PREPARE_DISABLED:false}
airchord.perf-jdbc-enabled=${AIRCHORD_PERF_JDBC_ENABLED:false}
airchord.perf-jdbc-sample-rate=${AIRCHORD_PERF_JDBC_SAMPLE_RATE:1.0}
airchord.perf-pg-enabled=${AIRCHORD_PERF_PG_ENABLED:false}
airchord.article-metric.publisher-run-budget-ms=${ARTICLE_METRIC_PUBLISHER_RUN_BUDGET_MS:250}
