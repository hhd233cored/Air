services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: your_space
      POSTGRES_USER: your_space
      POSTGRES_PASSWORD: your_space
    ports:
      - "5432:5432"
    volumes:
      - your-space-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U your_space -d your_space"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/your_space
      DB_USERNAME: your_space
      DB_PASSWORD: your_space
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  your-space-postgres:
