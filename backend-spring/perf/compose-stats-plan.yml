# Offline component benchmark only: prevent background vacuum from changing VM state.
# No application is started against this physical clone.
services:
  postgres:
    command: ["postgres", "-c", "track_io_timing=on", "-c", "track_wal_io_timing=on", "-c", "shared_preload_libraries=pg_stat_statements,auto_explain", "-c", "autovacuum=off"]
