# Diagnostic only: actual plans >=20ms; node timers/parameter logging disabled.
services:
  postgres:
    command: ["postgres", "-c", "track_io_timing=on", "-c", "track_wal_io_timing=on", "-c", "shared_preload_libraries=pg_stat_statements,auto_explain", "-c", "auto_explain.log_min_duration=20ms", "-c", "auto_explain.log_analyze=on", "-c", "auto_explain.log_timing=off", "-c", "auto_explain.log_buffers=on", "-c", "auto_explain.log_wal=on", "-c", "auto_explain.log_format=json", "-c", "auto_explain.log_parameter_max_length=0", "-c", "log_autovacuum_min_duration=0"]
