server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: your-space-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/your_space}
    username: ${DB_USERNAME:your_space}
    password: ${DB_PASSWORD:your_space}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
